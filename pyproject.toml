[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxway"
version = "0.1.0"
description = "Fluxway: A Flexible Large-scale Unified eXchange for maximizing Workload Accelerated Yield across heterogeneous compute clusters"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "See LICENSE file"}
authors = [
    {name = "Fluxway Contributors"}
]
keywords = [
    "distributed",
    "deep-learning",
    "spmd",
    "asynchronous",
    "graph-orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic",
    "uvloop",
    "numpy>=1.22,<2.5",
    "ray>=2.0.0",
    "numba>=0.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
torch = [
    "torch>=2.00.0",
    "safetensors",
]
jax = [
    "jax>=0.4.0",
    "orbax",
    "grain",
]
cuda11 = [
    "cupy-cuda11x>=13.0.0",
]
cuda12 = [
    "cupy-cuda12x>=13.0.0",
]
cuda13 = [
    "cupy-cuda13x>=13.0.0",
]
standard = [
    "cupy>=13.0.0",
]
profiler = [
    "perfetto",
]
visualization = [
    "ai-edge-model-explorer",
]


[project.urls]
Homepage = "https://github.com/fluxway/fluxway"
Documentation = "https://github.com/fluxway/fluxway#readme"
Repository = "https://github.com/fluxway/fluxway"

[tool.setuptools.packages.find]
include = ["fluxway*"]

[tool.setuptools.package-data]
fluxway = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
extend-exclude = []

[tool.ruff.lint]
extend-select = ["I", "B", "Q", "C4", "W", "UP"]
ignore = [
    "B003",
    "B005",
    "B007",
    "B008",
    "B011",
    "B012",
    "B015",
    "B017",
    "B028",
    "C408",
    "C417",
    "E741",
    # Below are auto-fixable rules
    "I001",
]

[tool.ruff.lint.flake8-quotes]
avoid-escape = false

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder", "afterray"]
known-local-folder = ["fluxway"]
known-third-party = []

[tool.ruff.lint.isort.sections]
afterray = ["psutil", "setproctitle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"doc/*" = ["I"]
"fluxway/__init__.py" = ["I"]
"release/*_tests/*.py" = ["I"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
