name: Nightly wheel

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/nightly.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-and-wheel:
    name: CI and wheel build
    uses: ./.github/workflows/ci.yml
